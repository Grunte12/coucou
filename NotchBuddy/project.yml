name: NotchBuddy
options:
  bundleIdPrefix: fr.louisraille
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: 256AUJ9555
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_ENTITLEMENTS: Resources/Coucou.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release
  CoucouAppStore:
    build:
      targets:
        CoucouAppStore: all
    run:
      config: Debug
    archive:
      config: Release

  HubIsland:
    build:
      targets:
        HubIsland: all
    run:
      config: Debug

  CoucouHub:
    build:
      targets:
        CoucouHub: all
    run:
      config: Debug

targets:
  # Migration target: the real Coucou app/shell plus our existing Hub model.
  # Same installed identity is intentional. Do not install alongside HubIsland.
  CoucouHub:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "HubIsland/**"
      - path: Sources/HubIsland
        excludes:
          - "HubIslandApp.swift"
          - "HubIslandWindowController.swift"
          - "HubIslandInstaller.swift"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        type: folder
        buildPhase: resources
    info:
      path: Resources/CoucouHub-Info.plist
      properties:
        CFBundleName: Hub Notch
        CFBundleDisplayName: Hub Notch
        CFBundleIdentifier: com.hubisland.desktop
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.1"
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        PRODUCT_NAME: HubIsland
        PRODUCT_BUNDLE_IDENTIFIER: com.hubisland.desktop
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: COUCOU_HUB
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: ""
      configs:
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: ""

  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "HubIsland/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Coucou
        CFBundleDisplayName: Coucou
        CFBundleIdentifier: fr.louisraille.NotchBuddy
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.1.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal et envoyer des mails."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.NotchBuddy
        PRODUCT_NAME: Coucou
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO

  CoucouAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "HubIsland/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Coucou
        CFBundleDisplayName: Coucou
        CFBundleIdentifier: fr.louisraille.Coucou
        CFBundleVersion: "4"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.louisraille.Coucou
        PRODUCT_NAME: Coucou
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/CoucouAppStore.entitlements
        DEVELOPMENT_TEAM: 256AUJ9555
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        CODE_SIGNING_ALLOWED: YES

  HubIsland:
    type: application
    platform: macOS
    sources:
      - path: Sources/HubIsland
        type: group
      - path: Sources/App/IslandScreenGeometry.swift
    info:
      path: Resources/HubIsland-Info.plist
      properties:
        CFBundleName: Hub Island
        CFBundleDisplayName: Hub Island
        CFBundleIdentifier: com.hubisland.desktop
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hubisland.desktop
        PRODUCT_NAME: HubIsland
        INFOPLIST_FILE: Resources/HubIsland-Info.plist
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: HUB_ISLAND
        OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGN_IDENTITY: ""
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: ""
